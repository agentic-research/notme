# Fixture (notme-a3804c): lists the Node compat flags workerd refuses at
# this date, in the multi-line array form, beside TOML the reader must get
# through: a multi-line literal var, an inline table, quoted and dotted keys,
# numbers and escaped strings.
name = "notme-bot"
main = "worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = [
  "nodejs_compat", # refused
  "some_other_flag",
]
"workers_dev" = false
limits = { cpu_ms = 50 }
observability.enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
CT_LOG_SHARDS = '''[
  {"path": "/logs/notme", "log_id": "fixture-secret-log-id"}
]'''
ESCAPED = "a \"quoted\" é value"
MULTI = """
line one \
  continued"""

[env.staging]
name = "notme-bot-staging"
compatibility_flags = ["nodejs_compat_v2"]

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
REKOR_URL = "https://rekor.sigstage.dev/"
