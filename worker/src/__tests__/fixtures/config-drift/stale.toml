# Fixture (notme-a3804c): a live wrangler.toml shaped like the one the
# 2026-11-04 review found, every id fake. Each DRIFT line is one the check names.
name = "notme-bot"
main = "worker.ts"
compatibility_date = "2026-03-01" # DRIFT: older than the template
workers_dev = false

[observability]
enabled = true

[[ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "CERT_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PASSKEY_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 5
  period = 60
# DRIFT: no SESSION_LIMITER, no PRINCIPAL_LIMITER
# DRIFT: no [version_metadata]

[vars]
SITE_URL = "https://notme.bot"
SIGNET_AUTHORITY_URL = "https://auth.notme.bot"
GHA_ALLOWED_OWNERS = "fixture-secret-owner-value"

[[kv_namespaces]]
binding = "CA_BUNDLE_CACHE"
id = "fixture-secret-kv-id-0000"

[env.staging]
name = "notme-bot-staging"

[env.staging.vars]
SITE_URL = "https://staging.notme.bot"
SIGNET_AUTHORITY_URL = "https://auth-staging.notme.bot"
GHA_ALLOWED_OWNERS = "fixture-secret-staging-owner"
ALLOWED_AUDIENCES = "https://staging.notme.bot,https://auth-staging.notme.bot"
# DRIFT: no REKOR_URL, no RENEWAL_BINDING_V3

[[env.staging.ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "1001" # DRIFT: production's namespace
  [env.staging.ratelimits.simple]
  limit = 20
  period = 60
