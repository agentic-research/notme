version: "3"

# Reusable TypeScript package release tasks.
#
# Package-local Taskfiles bind these variables:
#   TARGET_PKG: package.json path to bump, relative to the package directory
#   TAG_TEMPLATE: git tag template accepted by bumpp
#   PKG_NAME: pnpm workspace package name
vars:
  TARGET_PKG: '{{.TARGET_PKG | default "package.json"}}'
  TAG_TEMPLATE: '{{.TAG_TEMPLATE | default "v%s"}}'
  PKG_NAME: '{{.PKG_NAME | default ""}}'

tasks:
  bump:
    desc: "Interactively bump version, create a release commit, and tag via bumpp"
    cmds:
      # bumpp pushes by default. Keep pushing an explicit, separately reviewed
      # action so an interactive version bump cannot mutate a remote.
      - pnpm exec bumpp {{.TARGET_PKG}} --tag "{{.TAG_TEMPLATE}}" --no-push

  test:package:
    desc: "Verify the packed ESM package before publish"
    cmds:
      - pnpm --filter {{.PKG_NAME}} run test:package

  publish:
    desc: "Pack-smoke and publish a package to npm from a local CLI"
    cmds:
      - pnpm --filter {{.PKG_NAME}} run test:package
      - pnpm --filter {{.PKG_NAME}} publish --access public

  ci-publish:
    desc: "DEPRECATED — do not use. See publish-dpop.yml for the OIDC path."
    # Kept as a tombstone rather than deleted, because the shape of it is the
    # bug and a future package would otherwise copy it again (notme-4fa4a5).
    #
    # `--provenance` IS NOT A PNPM FLAG. It is absent from `pnpm publish
    # --help` on the pinned 10.30.3, and it was silently ignored: dpop-v0.2.0
    # published successfully through CI with this task and its tarball has NO
    # attestation (the registry attestations endpoint returns "Not found").
    # So this task advertised a verifiable build origin it never delivered.
    #
    # It also required a long-lived NODE_AUTH_TOKEN, the credential shape this
    # repository exists to eliminate.
    #
    # The replacement is `npm publish` under npm trusted publishing (OIDC),
    # wired directly in .github/workflows/publish-dpop.yml, with a post-publish
    # step that FAILS the build if the attestation is not actually queryable —
    # because "the flag was silently ignored" and "the flag worked" are
    # indistinguishable without checking.
    cmds:
      - |
        echo "release:ci-publish is deprecated — it published without the provenance it claimed." >&2
        echo "Use npm trusted publishing; see .github/workflows/publish-dpop.yml." >&2
        exit 1
