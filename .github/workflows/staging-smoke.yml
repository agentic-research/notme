# Deployed-runtime smoke on STAGING, after every merge to main (notme-6ae724).
#
# WHAT IT ADDS OVER ci.yml `contract`. That job boots the Worker locally, which
# proves the code and its config template. It cannot prove what only a real
# Cloudflare deployment shows: the account's bindings resolving, migrations
# applying to existing staging DO state (not a fresh one), custom domains and
# routing. This deploys main to the staging Worker — separate DOs, own CA, no
# VPC, carries no traffic (ADR-018 Phase 1) — and runs the same
# `worker:verify` checks against it.
#
# ── THE TOKEN CAN DEPLOY PRODUCTION ──
# Cloudflare API tokens scope to an account or a zone, not to one Worker
# script (developers.cloudflare.com/fundamentals/api/how-to/create-via-api/:
# policies support only User, Account and Zone resources). A token that can
# deploy notme-bot-staging can deploy notme-bot. So the fences are on the
# GitHub side, and they are MANDATORY before the secret is added:
#   - the `staging` environment's deployment-branch policy allows `main` ONLY.
#     Without it, any branch can add a workflow naming `environment: staging`
#     and read the secret. The `if:` below does not protect against that —
#     only the environment policy does;
#   - every job here also checks `github.ref == 'refs/heads/main'`, so a
#     workflow_dispatch from another ref runs nothing;
#   - the token is in the env of the deploy step only (review M1).
#     KNOWN LIMIT (re-review N6): that scoping is weaker than it looks. The
#     steps before the deploy (`worker:install`, `dpop:build`) run dependency
#     code in the same job, and can write $GITHUB_ENV (e.g. NODE_OPTIONS=
#     --require …) or $GITHUB_PATH, or replace node_modules/.bin/wrangler —
#     all of which the deploy step then runs with the token. Installs use
#     --ignore-scripts, which stops lifecycle hooks but not code those steps
#     run on purpose. The real fix is a separate deploy job that receives only
#     a built artifact and installs nothing; tracked in docs/REMAINING-WORK.md,
#     not built yet.
# The only real isolation is a separate Cloudflare account for staging.
#
# ── IT DOES NOT RUN UNTIL THE OWNER CONFIGURES IT ──
# `configured` checks that the secret and every var exist (seeing only a
# boolean for the secret). If not, `staging-smoke` is SKIPPED — grey in the UI,
# not green — and `configured` emits a warning saying why (review L4). Failing
# instead would put a red X on every merge to main for something that is not
# a defect in the merged code; a skip is visibly not-a-pass without that noise.
#
# Owner setup (GitHub → Settings → Environments → `staging`):
#   deployment branches: `main` only                       (MANDATORY)
#   secret CLOUDFLARE_STAGING_API_TOKEN  — Workers Scripts:Edit + Workers KV
#          Storage:Edit, this account only; set an expiry (`expires_on`).
#   var CLOUDFLARE_ACCOUNT_ID
#   var STAGING_KV_NAMESPACE_ID          — staging CA_BUNDLE_CACHE id
#   var STAGING_SITE_URL                 — https://staging.notme.bot
#   var STAGING_SIGNET_AUTHORITY_URL     — https://auth-staging.notme.bot
#   var STAGING_GHA_ALLOWED_OWNERS       — staging's OWN allowlist (never production's, notme-1532eb)
#   var STAGING_ALLOWED_AUDIENCES        — staging audiences
#   var STAGING_RENEWAL_BINDING_V3       — "off" until a release is at 100% on staging
#   var STAGING_REKOR_URL                — https://rekor.sigstage.dev (Sigstore STAGING Rekor; never public)
# `wrangler deploy` makes the config's vars authoritative, so these ARE
# staging's vars after every merge. scripts/staging-config.ts requires one per
# key in the template's [env.staging.vars] and refuses any placeholder left in
# a staging table (review H1).
#
# WHY NOT ON PULL REQUESTS. A PR job holding a deploy token runs the PR's code
# with that token. Post-merge only; `workflow_dispatch` for a manual re-run.
name: Staging smoke (deployed)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  configured:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: staging
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_KV_NAMESPACE_ID: ${{ vars.STAGING_KV_NAMESPACE_ID }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          STAGING_SIGNET_AUTHORITY_URL: ${{ vars.STAGING_SIGNET_AUTHORITY_URL }}
          STAGING_GHA_ALLOWED_OWNERS: ${{ vars.STAGING_GHA_ALLOWED_OWNERS }}
          STAGING_ALLOWED_AUDIENCES: ${{ vars.STAGING_ALLOWED_AUDIENCES }}
          STAGING_RENEWAL_BINDING_V3: ${{ vars.STAGING_RENEWAL_BINDING_V3 }}
          STAGING_REKOR_URL: ${{ vars.STAGING_REKOR_URL }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_STAGING_API_TOKEN(secret)"
          for v in CLOUDFLARE_ACCOUNT_ID STAGING_KV_NAMESPACE_ID STAGING_SITE_URL \
                   STAGING_SIGNET_AUTHORITY_URL STAGING_GHA_ALLOWED_OWNERS \
                   STAGING_ALLOWED_AUDIENCES STAGING_RENEWAL_BINDING_V3 STAGING_REKOR_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=staging smoke NOT RUN::the 'staging' environment is missing:$missing — the deployed check is skipped, not passed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  staging-smoke:
    needs: configured
    if: github.ref == 'refs/heads/main' && needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-task

      - run: task worker:install
      - run: task dpop:build

      - name: Build worker/wrangler.toml — every staging var from the environment, no placeholders
        env:
          STAGING_KV_NAMESPACE_ID: ${{ vars.STAGING_KV_NAMESPACE_ID }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          STAGING_SIGNET_AUTHORITY_URL: ${{ vars.STAGING_SIGNET_AUTHORITY_URL }}
          STAGING_GHA_ALLOWED_OWNERS: ${{ vars.STAGING_GHA_ALLOWED_OWNERS }}
          STAGING_ALLOWED_AUDIENCES: ${{ vars.STAGING_ALLOWED_AUDIENCES }}
          STAGING_RENEWAL_BINDING_V3: ${{ vars.STAGING_RENEWAL_BINDING_V3 }}
          STAGING_REKOR_URL: ${{ vars.STAGING_REKOR_URL }}
        run: pnpm exec tsx scripts/staging-config.ts worker/wrangler.toml.example worker/wrangler.toml

      # The ONLY step that sees the token.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: task worker:deploy-staging

      # Convergence first (same reason as ship-prod): a verify during the
      # rollover can pass against the build being replaced. The script reads
      # AUTH_BASE/EXPECT from the process environment.
      - env:
          AUTH_BASE: https://auth-staging.notme.bot
          EXPECT: ${{ github.sha }}
        run: task worker:await-convergence
      - run: task worker:verify-staging
