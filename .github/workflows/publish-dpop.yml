# Publish @agentic-research/dpop to npmjs.org.
#
# Why this exists: two downstream repos (cloister, canonical-hours) vendored a
# byte-copy of the DPoP SDK because there was no package to depend on. This is
# the step that lets those copies be deleted (notme-18450e / cloister-195e47).
#
# Registry note: this briefly published to GitHub Packages as
# @agentic-research/dpop (v0.1.0). That registry requires authentication to
# INSTALL even for public packages — 401 anonymous — which put a token
# requirement on every consumer, including external resource servers verifying
# notme tokens and every local dev machine. Since a public identity provider's
# verifier SDK wants the widest possible reach, it moved to npmjs.org, where
# anonymous install works and no consumer needs an .npmrc at all.
#
# Scoped `@agentic-research/dpop` deliberately: the agentic-research npm org
# owns the public verifier SDK namespace alongside the GitHub org. The GitHub
# Packages copy is left in place but frozen at 0.1.0.
#
# Trigger: push a tag `dpop-v<version>` matching packages/dpop/package.json.
# The version check below fails the run on a mismatch rather than publishing
# something whose tag lies about its contents.
name: publish-dpop

on:
  push:
    tags:
      - "dpop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC): npm exchanges this token
      # for short-lived publish credentials, and derives the provenance
      # attestation from it. No NPM_TOKEN is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # package.json pins the exact pnpm release; the action reads it rather
      # than maintaining a second version declaration here.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
          scope: "@agentic-research"
      - uses: ./.github/actions/setup-task

      - run: pnpm install --frozen-lockfile

      # The published artifact is the thing under test. Building and testing
      # before publish keeps a broken tarball from reaching consumers, since an
      # npm version is immutable once it lands.
      #
      # Run from worker/, not the repo root: vitest is a devDependency of the
      # worker package only, so `pnpm vitest` at the root resolves to nothing in
      # a clean CI install (it appears to work locally purely through hoisting).
      # worker's vitest config globs ../packages/dpop/__tests__, so this single
      # run covers the SDK's own 67 tests AND proves worker still resolves the
      # package through its bare specifier — a stronger gate than testing the
      # package alone.
      - name: Test (worker suite includes packages/dpop)
        working-directory: worker
        run: pnpm vitest run
      - run: task dpop:build

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#dpop-v}"
          PKG_VERSION="$(node -p "require('./packages/dpop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME implies $TAG_VERSION but package.json says $PKG_VERSION" >&2
            exit 1
          fi
          echo "version $PKG_VERSION matches tag"

      # README doc links are pinned to the release tag rather than main, so a
      # reader of a published version sees the docs that shipped with it. npm
      # renders only README.md — never docs/*.mdx — so those links are the
      # entire discovery path from the package page, and a stale one silently
      # serves the wrong version's docs.
      #
      # This guard exists because the comment in README.md claimed a check
      # already enforced this and none did. An unenforced claim in a comment is
      # the same defect class as `pnpm publish --provenance`: it reads as a
      # control while nothing runs.
      - name: README doc links must be pinned to this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          README=packages/dpop/README.md

          # Any docs link NOT pinned to this exact tag is a failure — including
          # blob/main, which is the drift this exists to catch.
          if bad=$(grep -oE "blob/[^/]+/packages/dpop/docs/" "$README" \
                   | grep -v "blob/${GITHUB_REF_NAME}/" | sort -u); then
            if [ -n "$bad" ]; then
              echo "README doc links not pinned to ${GITHUB_REF_NAME}:" >&2
              echo "$bad" >&2
              echo "Update them to blob/${GITHUB_REF_NAME}/packages/dpop/docs/" >&2
              exit 1
            fi
          fi

          # And every doc that exists must be linked, or shipping it is pointless
          # — it reaches the tarball and nothing points a reader at it.
          for f in packages/dpop/docs/*.mdx; do
            base=$(basename "$f")
            grep -q "blob/${GITHUB_REF_NAME}/packages/dpop/docs/${base}" "$README" || {
              echo "docs/${base} ships but is not linked from README.md" >&2
              exit 1
            }
          done
          echo "all doc links pinned to ${GITHUB_REF_NAME} and every doc linked"

      # npm, not pnpm, and no NODE_AUTH_TOKEN.
      #
      # Two verified defects motivated this (notme-4fa4a5):
      #
      #   1. `pnpm publish --provenance` was a NO-OP. `--provenance` is not a
      #      pnpm flag (absent from `pnpm publish --help` on the pinned
      #      10.30.3). dpop-v0.2.0 ran through this workflow successfully and
      #      its published tarball still has NO attestation —
      #      registry.npmjs.org/-/npm/v1/attestations/... returns "Not found".
      #      So the comment above this step used to promise consumers a
      #      verifiable build origin that was never actually attached.
      #
      #   2. Authentication was a long-lived stored NPM_TOKEN — the exact
      #      credential shape this repository exists to eliminate.
      #
      # Trusted publishing fixes both at once: OIDC replaces the stored token,
      # and npm derives provenance from the same id-token. Requires npm
      # >= 11.5.1; setup-node's Node 22 bundles npm 10.x, hence the explicit
      # upgrade.
      #
      # ONE-TIME MANUAL PREREQUISITE: the package must have a trusted publisher
      # configured at npmjs.com (Settings -> Trusted publisher) naming this
      # repository AND this workflow filename. Without it npm rejects the
      # publish with an auth error rather than falling back to a token.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Pack smoke
        working-directory: packages/dpop
        run: npm run test:package

      - name: Publish (OIDC trusted publishing, no stored token)
        working-directory: packages/dpop
        run: npm publish --access public --provenance

      # The claim is verified, not asserted. Defect (1) above survived because
      # nothing ever checked that provenance actually landed — a silently
      # ignored flag looks identical to a working one. This step turns that
      # class of failure into a red build.
      - name: Verify provenance actually landed
        run: |
          VERSION="$(node -p "require('./packages/dpop/package.json').version")"
          URL="https://registry.npmjs.org/-/npm/v1/attestations/@agentic-research%2fdpop@${VERSION}"
          echo "checking $URL"
          for i in 1 2 3 4 5; do
            BODY="$(curl -sS "$URL" || true)"
            if echo "$BODY" | grep -q '"attestations"'; then
              echo "provenance attestation present for ${VERSION}"
              exit 0
            fi
            echo "not visible yet (attempt $i), waiting for registry propagation..."
            sleep 10
          done
          echo "::error::published ${VERSION} but NO provenance attestation is queryable — do not advertise verifiable build origin for this version" >&2
          exit 1
