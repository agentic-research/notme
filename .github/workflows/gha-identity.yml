name: GHA Identity Exchange

# Reusable workflow: one OIDC token → two exchanges.
#
#   1. octo-sts  → scoped GitHub App token   (eliminates stored PATs)
#   2. notme.bot → bridge CERT PAIR          (secretless — no private key on disk)
#
# OUTPUT SHAPE (corrected 2026-08-05, notme-c0a4aa). This workflow previously
# declared `notme_token` and `expires_in`, which `action/` has never emitted —
# it outputs a cert pair plus `expires_at` (action/src/index.ts, action.yml).
# Both therefore resolved to the empty string for every caller. It went
# unnoticed because the only caller is test-identity.yml, which is
# workflow_dispatch-only and asserts nothing, and it last ran green weeks
# before the action's output shape changed. Changing these outputs is safe
# precisely because nothing could have been using them: a cross-repo sweep
# found zero `uses:` consumers, and signet keeps a local copy that already
# matches the cert-pair interface — signet's copy was RIGHT and this file was
# wrong.
#
# The private keys behind these certs never leave the action's process, which
# is the point: what crosses the job boundary is public certificate material,
# useless on its own.
#
# Usage:
#
#   jobs:
#     identity:
#       uses: agentic-research/notme/.github/workflows/gha-identity.yml@<sha>
#       with:
#         octo_sts_scope: agentic-research/ley-line
#         octo_sts_identity: mache-release
#       permissions:
#         id-token: write
#
#     next-job:
#       needs: identity
#       steps:
#         - env:
#             GH_TOKEN: ${{ needs.identity.outputs.github_token }}
#           run: gh release download ...
#         - name: Use notme identity
#           # The certs are public material; the matching private keys stayed
#           # in the identity job's process and are NOT available here. A job
#           # that needs to AUTHENTICATE (mTLS, signing, a DPoP-bound token)
#           # must run the action itself to get its own keypair — the same
#           # constraint the old note described, and the reason a token output
#           # would have been the wrong shape even if it had worked.
#           env:
#             NOTME_IDENTITY: ${{ needs.identity.outputs.notme_identity }}
#             NOTME_CERT: ${{ needs.identity.outputs.notme_cert }}

on:
  workflow_call:
    inputs:
      octo_sts_scope:
        description: 'octo-sts scope (org/repo). Leave empty to skip GitHub token exchange.'
        required: false
        type: string
        default: ''
      octo_sts_identity:
        description: 'Trust policy identity name (filename without .sts.yaml)'
        required: false
        type: string
        default: 'default'
      bridge_audience:
        description: 'Audience for the OIDC token request'
        required: false
        type: string
        default: 'notme.bot'
      skip_bridge_cert:
        description: 'Set to true to skip identity exchange (octo-sts only)'
        required: false
        type: boolean
        default: false
    outputs:
      github_token:
        description: 'Scoped GitHub token from octo-sts. Empty if octo_sts_scope not provided.'
        value: ${{ jobs.exchange.outputs.github_token }}
      notme_url:
        description: 'Authority URL for subsequent API calls'
        value: ${{ jobs.exchange.outputs.notme_url }}
      notme_cert:
        description: 'P-256 bridge cert PEM — mTLS transport auth. Public data; useless without the private key, which never leaves the action process.'
        value: ${{ jobs.exchange.outputs.notme_cert }}
      notme_signing_cert:
        description: 'Ed25519 bridge cert PEM — commit signing and APAS attestations. Public data.'
        value: ${{ jobs.exchange.outputs.notme_signing_cert }}
      notme_identity:
        description: 'WIMSE identity URI (wimse://notme.bot/gha/{owner}/{repo})'
        value: ${{ jobs.exchange.outputs.notme_identity }}
      expires_at:
        description: 'Cert expiry, Unix timestamp'
        value: ${{ jobs.exchange.outputs.expires_at }}

jobs:
  exchange:
    name: OIDC Exchange
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      github_token: ${{ steps.octo-sts.outputs.token }}
      notme_url: ${{ steps.signet.outputs.notme_url }}
      notme_cert: ${{ steps.signet.outputs.notme_cert }}
      notme_signing_cert: ${{ steps.signet.outputs.notme_signing_cert }}
      notme_identity: ${{ steps.signet.outputs.notme_identity }}
      expires_at: ${{ steps.signet.outputs.expires_at }}

    steps:
      - name: Exchange OIDC → GitHub token (octo-sts)
        id: octo-sts
        if: inputs.octo_sts_scope != ''
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ inputs.octo_sts_scope }}
          identity: ${{ inputs.octo_sts_identity }}

      - name: Exchange OIDC → notme access token
        id: signet
        if: '!inputs.skip_bridge_cert'
        # SHA-pin the self-reference. It must be ABSOLUTE, not `./action`:
        # this is a REUSABLE workflow, so a local path would resolve against
        # the CALLER's checkout, which has no action/ directory.
        #
        # The pin therefore decides WHICH VERSION of our own code runs, and
        # nothing about it is load-bearing for security — we control this
        # repo. Which is why it rotted: it sat at e57c9ad through three merged
        # PRs while its comment claimed to be "the current shipping state"
        # (notme-28959a). A security rebuild of action/dist reaches this
        # workflow only when this line moves.
        #
        # `task pin:check` now runs scripts/check-self-pins.ts, which compares
        # the pinned action/ TREE against the default branch and fails with the
        # SHA to use. Do not hand-maintain this comment's accuracy — the check
        # is what keeps the pin honest.
        uses: agentic-research/notme/action@0d2312fe9ccc2e1cb710fba6d4dad71f531dfbee # newest main commit touching action/
        with:
          audience: ${{ inputs.bridge_audience }}
          authority_url: https://auth.notme.bot
