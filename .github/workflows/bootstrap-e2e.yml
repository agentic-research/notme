# Attested first boot, end to end, with a REAL GitHub OIDC token.
#
# WHY THIS RUNS IN CI AND NOT AGAINST A DEPLOYMENT. Criterion E's bootstrap
# path was covered by tests that forge genuinely-signed tokens against a
# STUBBED JWKS — proving the code path, not the integration. The integration
# needs a token GitHub actually signed, and the one place that exists is
# inside an Actions job.
#
# It cannot be pointed at staging: staging's GHA_ALLOWED_OWNERS must differ
# from production's (notme-1532eb, a red-team finding about staging being
# name-identical to production), so a real agentic-research workflow is
# refused there by design. Loosening that control to exercise another one is
# a bad trade, so the Worker runs LOCALLY here instead — its CA is born in
# local storage and dies with the job, so the certificates it mints are worth
# nothing anywhere, which is exactly what makes the real owner allowlist safe
# in this config and nowhere else.
name: Attested bootstrap (e2e)

on:
  workflow_dispatch:
  # Runs when the thing it checks changes. `workflow_dispatch` alone is not
  # enough: the API only dispatches workflows present on the DEFAULT branch,
  # so a check developed on a feature branch could never be run there — which
  # is precisely when it is most worth running.
  push:
    paths:
      - "worker/worker.ts"
      - "worker/src/signing-authority.ts"
      - "worker/src/auth/bootstrap-policy.ts"
      - "worker/src/gha-oidc.ts"
      - "worker/wrangler.e2e.toml"
      - "scripts/bootstrap-e2e.mjs"
      - ".github/workflows/bootstrap-e2e.yml"

permissions: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the whole point: a real GitHub-signed OIDC token
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: ./.github/actions/setup-task

      # `task`, not raw pnpm — CI's own rule is that the Taskfile is the
      # single source of truth beyond toolchain bootstrap.
      - run: task worker:install

      # BUILD dpop, or wrangler cannot resolve it. worker.ts imports
      # @agentic-research/dpop, a workspace sibling whose entry point is
      # ./dist/index.js — produced by tsc and gitignored. Installs use
      # --ignore-scripts, which is exactly what skips the prepack that would
      # build it, so on a clean checkout the module does not exist and esbuild
      # fails with `Could not resolve "@agentic-research/dpop"`.
      #
      # This trap is already documented on `worker:build-local`, and it caught
      # this workflow anyway: it reproduces only on a CLEAN checkout, and a
      # developer machine always has dist/ lying around from an earlier build.
      # That is why the local run of this same config succeeded in 3 seconds
      # while CI could not start at all.
      - run: task dpop:build

      - name: Request a real OIDC token and read its subject
        id: oidc
        # The audience must match what the worker checks (GHA_CERT_AUDIENCE,
        # default notme.bot). The `sub` is read back out of the token rather
        # than assembled from github.* context, because assembling it is
        # exactly the mistake this check exists to catch: the ref segment is
        # trigger-dependent (refs/heads/… vs refs/tags/…) and a mismatch
        # fails SILENTLY — bootstrap never fires and nothing says why.
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=notme.bot" | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "no OIDC token"; exit 1; }
          SUB=$(printf '%s' "$TOKEN" | cut -d. -f2 \
            | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
            | base64 -d 2>/dev/null | jq -r '.sub')
          echo "subject: $SUB"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"

      - name: Bootstrap a fresh authority with the real token, end to end
        working-directory: worker
        timeout-minutes: 5
        env:
          BOOTSTRAP_SUB: ${{ steps.oidc.outputs.sub }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          AUTH_BASE: http://localhost:8787
          # No telemetry prompt, and never reach for an account: this Worker
          # is local-only and has no Cloudflare resources to resolve.
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ""
        # ONE step start-to-finish, deliberately. Backgrounding the worker in
        # one step and testing in the next hung twice: a child started in a
        # `run:` block keeps the runner waiting on the step even when the
        # script itself is done, and detaching it portably is fiddlier than
        # the check is worth. Keeping the process inside a single step means
        # its lifetime is the step's lifetime, and the trap cleans it up on
        # every exit path.
        run: |
          set -uo pipefail
          pnpm exec wrangler dev --config wrangler.e2e.toml --port 8787 \
            --var "BOOTSTRAP_GHA_SUBJECT:$BOOTSTRAP_SUB" \
            </dev/null > /tmp/wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          # --max-time is not optional: `wrangler dev` accepts the TCP
          # connection before it can answer, so an unbounded probe blocks
          # forever on the first attempt and the loop never counts.
          # THE BUDGET MUST FIT INSIDE timeout-minutes, or the diagnostic
          # never runs. 90 iterations x (5s curl + 1s sleep) is up to nine
          # minutes against a five-minute step, so the first attempt timed
          # out having printed NOTHING — the log dump below was unreachable,
          # which made an ordinary startup failure look like a hang.
          # 30 x (2 + 1) = 90s worst case, and the log is shown on the way.
          up=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 -o /dev/null "http://localhost:8787/.well-known/version"; then
              echo "worker up after ~${i}s"; up=1; break
            fi
            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              echo "wrangler exited during startup"; break
            fi
            if [ "$i" = 10 ]; then
              echo "--- wrangler log after 10 attempts ---"; cat /tmp/wrangler.log || true
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "--- wrangler log ---"; cat /tmp/wrangler.log; exit 1
          fi

          node ../scripts/bootstrap-e2e.mjs
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- wrangler log ---"; cat /tmp/wrangler.log
          fi
          exit "$status"

      - name: Worker log (on failure)
        if: failure()
        run: cat /tmp/wrangler.log || true
