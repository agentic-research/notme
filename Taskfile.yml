version: "3"

includes:
  dpop:
    taskfile: ./packages/dpop
    dir: ./packages/dpop

tasks:
  # Root pnpm install — used by any root-scope task that runs `pnpm exec`.
  # --ignore-scripts: never run install hooks (defense-in-depth, matches
  # worker:install + .npmrc posture). --frozen-lockfile: fail on lockfile
  # drift. `sources:` makes Task skip re-running when nothing changed.
  deps:install:
    desc: Install root deps (tsx, yaml, zod) via pnpm
    sources:
      - package.json
      - pnpm-lock.yaml
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts

  schema:ts:
    desc: Generate TypeScript types + Zod schemas from Cap'n Proto
    deps: [deps:install]
    cmds:
      - pnpm exec tsx schema/codegen/capnp-to-ts.ts schema/identity.capnp > gen/ts/identity.ts
      - echo "Generated gen/ts/identity.ts"

  schema:go:
    desc: Generate Go types from Cap'n Proto
    cmds:
      - capnp compile -o go:gen/go --src-prefix=schema -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" schema/identity.capnp
      - echo "Generated gen/go/identity.capnp.go"

  schema:all:
    desc: Generate all language bindings
    deps: [schema:ts, schema:go]

  schema:check:
    desc: Type-check generated code
    deps: [schema:ts]
    cmds:
      - pnpm exec tsc --noEmit --strict --moduleResolution bundler --module ES2022 --target ES2022 --skipLibCheck gen/ts/identity.ts

  worker:dev:
    desc: Start local dev server
    dir: worker
    cmds:
      - pnpm exec wrangler dev

  worker:install:
    desc: Clean install from lockfile (no scripts)
    dir: worker
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts

  worker:audit:
    desc: Check for known vulnerabilities
    dir: worker
    cmds:
      - pnpm audit --prod

  worker:check:
    desc: Type-check + test (audit is its own task — `worker:audit`)
    dir: worker
    deps: [dpop:build]
    cmds:
      - pnpm exec tsc --noEmit
      # Type-check the pool tests (*.do.test.ts), which the base tsconfig
      # excludes (**/*.test.ts) and vitest transpiles via esbuild without
      # checking. tsconfig.test.json loads the cloudflare:test types + the
      # ProvidedEnv augmentation so env bindings + DO instances are typed.
      - pnpm exec tsc -p tsconfig.test.json
      - pnpm exec vitest run
      # Real-Durable-Object tests (*.do.test.ts) via vitest-pool-workers.
      # Hermetic — its config declares DO bindings inline (no wrangler.toml,
      # no remote VPC binding), so it needs no CF creds and runs in CI.
      - pnpm exec vitest run --config vitest.workers.config.mts

  proxy:check:
    desc: Build + test the Rust mTLS proxy crate
    dir: proxy
    cmds:
      - cargo build --locked
      - cargo test --locked
      - cargo clippy --locked --tests -- -D warnings

  worker:deploy-preview:
    desc: Upload new version without routing traffic to it
    dir: worker
    cmds:
      # Stamp the build so the deployed Worker can say WHICH build it is
      # (notme-9f2f79). Deploys here are manual, so without this the git tree
      # does not settle what is running and a consumer waiting on a fix can
      # only ask. Read back at GET /.well-known/version.
      #
      # A --var binding rather than a generated source file: a generated file
      # would change every commit, which makes reproducibility gates like
      # action:bundle-check meaningless, and would need gitignoring — putting
      # the value outside review.
      - pnpm exec wrangler versions upload --var BUILD_SHA:$(git rev-parse HEAD)

  worker:deploy:
    desc: Deploy to production (use ship for the safe path)
    dir: worker
    cmds:
      # Stamp the build so the deployed Worker can say WHICH build it is
      # (notme-9f2f79). Deploys here are manual, so without this the git tree
      # does not settle what is running and a consumer waiting on a fix can
      # only ask. Read back at GET /.well-known/version.
      #
      # A --var binding rather than a generated source file: a generated file
      # would change every commit, which makes reproducibility gates like
      # action:bundle-check meaningless, and would need gitignoring — putting
      # the value outside review.
      - pnpm exec wrangler deploy --var BUILD_SHA:$(git rev-parse HEAD)

  worker:rollback:
    desc: Roll back to previous version
    dir: worker
    cmds:
      - pnpm exec wrangler rollback

  worker:verify:
    desc: Smoke test live endpoints with bounded deployment-convergence retries
    # AUTH_BASE / SITE_BASE default to production; `worker:verify-staging`
    # passes the staging hosts so both environments share ONE definition of
    # "the service works" instead of a staging copy that drifts.
    vars:
      AUTH_BASE: '{{.AUTH_BASE | default "https://auth.notme.bot"}}'
      SITE_BASE: '{{.SITE_BASE | default "https://notme.bot"}}'
    cmds:
      - |
        FAIL=0
        AUTH_BASE="{{.AUTH_BASE}}"
        SITE_BASE="{{.SITE_BASE}}"
        AUTH_HOST="${AUTH_BASE#https://}"
        VERIFY_NONCE="$(date +%s)"
        MAX_ATTEMPTS=5
        RETRY_DELAY_SECONDS=2
        BODY_FILE="$(mktemp)"
        trap 'rm -f "$BODY_FILE"' EXIT

        check_request() {
          label="$1"
          method="$2"
          url="$3"
          expected_status="$4"
          expected_pattern="$5"
          data="${6:-}"
          accept="${7:-}"
          attempt=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if [ "$method" = "POST" ]; then
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
                -X POST "$url" -H "Content-Type: application/json" -d "$data")
            elif [ -n "$accept" ]; then
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
                -H "Accept: $accept" "$url")
            else
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" "$url")
            fi

            if [ "$status" = "$expected_status" ] && grep -Fq "$expected_pattern" "$BODY_FILE"; then
              echo "✓ $label"
              return 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_DELAY_SECONDS"
            fi
            attempt=$((attempt + 1))
          done

          detail=$(head -c 160 "$BODY_FILE" | tr '\n' ' ')
          echo "✗ $label (got $status; body: $detail)"
          FAIL=1
        }

        echo "=== ${AUTH_HOST} ==="
        check_request "landing" "GET" "${AUTH_BASE}/" "200" "identity authority"
        check_request "login" "GET" "${AUTH_BASE}/login" "200" "passkey"
        check_request "discovery" "GET" "${AUTH_BASE}/.well-known/signet-authority.json" "200" '"issuer"'
        # Cache API entries survive Worker deployments. A unique query checks
        # the newly deployed handler instead of the previous version's cache.
        check_request "ca-bundle" "GET" "${AUTH_BASE}/.well-known/ca-bundle.pem?verify=$VERIFY_NONCE" "200" "BEGIN CERTIFICATE"
        check_request "jwks" "GET" "${AUTH_BASE}/.well-known/jwks.json?verify=$VERIFY_NONCE" "200" '"crv":"Ed25519"'
        # The deployed build must be able to NAME ITSELF. Asserting
        # "stamped":true rather than merely a 200: an endpoint that always
        # answered "unknown" would pass a liveness check while telling a
        # consumer nothing, which is the state that made signet's "no positive
        # evidence" objection correct (notme-9f2f79). No nonce — it is
        # no-store, so there is no cache entry to bypass.
        check_request "build-version" "GET" "${AUTH_BASE}/.well-known/version" "200" '"stamped":true'
        # Expect the environment's own authority host in the docs page — a
        # staging deploy that renders production URLs is a config leak, not
        # a pass. Nonce for the same reason as ca-bundle: Cache API entries
        # survive deployments, and this handler cachePuts with max-age=3600.
        check_request "api-docs" "GET" "${AUTH_BASE}/api/docs?verify=$VERIFY_NONCE" "200" "${AUTH_HOST}"
        check_request "passkey-status" "GET" "${AUTH_BASE}/auth/passkey/status" "401" '"error":"unauthorized"'
        check_request "authorize" "GET" "${AUTH_BASE}/authorize" "400" '"error":"redirect_uri required"'
        check_request "token" "POST" "${AUTH_BASE}/token" "400" '"error":"dpop_proof_required"' '{"audience":"https://test"}'
        # Every check above names a route that exists. Nothing covered the
        # fallthrough, which is where notme-cb0354 lived: unmatched paths came
        # back as error 1101 in production for as long as the VPC tunnel was
        # unhealthy, and the gate stayed green throughout.
        #
        # The body pattern is the Worker's own constant 404, which it returns
        # when the VPC fetch fails. A HEALTHY tunnel would instead hand back
        # whatever signet answers for an unknown path, so if this check ever
        # fails on the pattern rather than the status, read it as "the tunnel
        # came up" and decide there whether signet's 404 shape is acceptable
        # to expose — do not just relax the assertion. The status is the part
        # that must never regress: 1101 surfaces as 500.
        check_request "unmatched-path" "GET" "${AUTH_BASE}/.well-known/not-a-route-$VERIFY_NONCE" "404" '"error":"not_found"'

        echo "=== ${SITE_BASE#https://} ==="
        check_request "homepage" "GET" "${SITE_BASE}/" "200" "notme"
        check_request "apas" "GET" "${SITE_BASE}/apas?verify=$VERIFY_NONCE" "200" "0.2.1-draft"
        check_request "apas-schema" "GET" "${SITE_BASE}/provenance/dispatch/v1?verify=$VERIFY_NONCE" "200" '"workItemRef"' "" "application/schema+json"

        echo "---"
        [ $FAIL -eq 0 ] && echo "All checks passed." || { echo "SOME CHECKS FAILED"; exit 1; }

  node:preflight:
    desc: Fail fast, with remediation, when local Node can't run the release path
    # Evaluates the DECLARED range (package.json engines.node) rather than
    # hardcoding a second copy that would drift. Exists because ship-prod on
    # an unsupported Node died inside worker:install with a raw
    # ERR_PNPM_UNSUPPORTED_ENGINE and no next step (notme-8bea0d) — CI never
    # sees this (workflows pin node 22), only local release runs do.
    #
    # SUPPORTED RANGE SYNTAX: `^x.y.z`, `>=x.y.z`, exact `x.y.z`, joined by
    # `||`. That is deliberately a SUBSET of npm semver, and anything else
    # (`~`, `x`-ranges, hyphen ranges, prerelease tags) fails CLOSED — an
    # unrecognized range matches nothing, so the task refuses to run rather
    # than admitting an untested runtime. If engines.node ever needs syntax
    # outside that subset, extend this parser or depend on `semver` — do NOT
    # widen the fallback, because failing open here silently restores the
    # exact defect this task exists to prevent.
    cmds:
      - |
        node -e '
          const { engines } = require("./package.json");
          const want = engines && engines.node;
          if (!want) { console.error("package.json declares no engines.node — add one (notme-8bea0d)"); process.exit(1); }
          const v = process.versions.node.split(".").map(Number);
          const ge = (a, b) => { for (let i = 0; i < 3; i++) { if ((a[i]||0) !== (b[i]||0)) return (a[i]||0) > (b[i]||0); } return true; };
          const ok = want.split("||").map(s => s.trim()).some(range => {
            const m = range.match(/^(\^|>=)?(\d+)\.(\d+)\.(\d+)$/);
            if (!m) return false;
            const min = [Number(m[2]), Number(m[3]), Number(m[4])];
            if (m[1] === "^") return v[0] === min[0] && ge(v, min);
            if (m[1] === ">=") return ge(v, min);
            return v[0] === min[0] && v[1] === min[1] && v[2] === min[2];
          });
          if (!ok) {
            console.error("Node v" + process.versions.node + " cannot run the release path — package.json engines.node wants: " + want);
            console.error("Remediation (CI pins Node 22):");
            console.error("  mise use node@22    # or: nvm use 22");
            process.exit(1);
          }
          console.log("node v" + process.versions.node + " satisfies engines.node (" + want + ")");
        '

  # --- staging + canary promotion (goal-zero release train) ------------------
  #
  # Promotion order: ship-staging (separate Worker, own DOs/KV, no VPC) →
  # worker:deploy-preview (upload the EXACT production artifact, get a version
  # id) → worker:canary (gradual deployment, split traffic) → worker:promote
  # (100% to the version already soaking). Rollback at any point is
  # worker:canary/promote back to the OLD version id — same mechanism, no
  # special path. NOTE: a version carrying a new [[migrations]] entry cannot
  # be split-deployed; Durable Object migrations promote atomically and
  # deleted-class migrations do not roll back. Check `git diff` on
  # wrangler.toml migrations before choosing the canary path.

  worker:deploy-staging:
    desc: Deploy to the staging Worker (notme-bot-staging, isolated state)
    dir: worker
    cmds:
      - pnpm exec wrangler deploy --env staging --var BUILD_SHA:$(git rev-parse HEAD)

  worker:verify-staging:
    desc: Smoke test staging endpoints (same checks as production verify)
    cmds:
      - task: worker:verify
        vars:
          AUTH_BASE: "https://auth-staging.notme.bot"
          SITE_BASE: "https://staging.notme.bot"

  ship-staging:
    desc: "Staging gate: preflight → install → check → docs → deploy staging → verify staging"
    cmds:
      - task: node:preflight
      - task: worker:install
      - task: worker:check
      - task: docs:check
      - task: worker:deploy-staging
      - task: worker:verify-staging

  # ENV selects the wrangler environment: unset = production, ENV=staging =
  # the staging Worker. The SAME three tasks drive both, so the canary path
  # rehearsed on staging is literally the one that promotes production —
  # rather than a staging rehearsal of a different command (same reasoning as
  # worker:verify's AUTH_BASE/SITE_BASE).
  worker:versions:
    desc: "List uploaded versions — ids for canary/promote/rollback ([ENV=staging])"
    dir: worker
    vars:
      ENV_FLAG: '{{if .ENV}}--env {{.ENV}}{{end}}'
    cmds:
      - pnpm exec wrangler versions list {{.ENV_FLAG}}

  worker:canary:
    desc: "Split traffic: NEW=<version-id> OLD=<version-id> [PCT=10] [ENV=staging]"
    dir: worker
    vars:
      PCT: '{{.PCT | default "10"}}'
      ENV_FLAG: '{{if .ENV}}--env {{.ENV}}{{end}}'
    preconditions:
      - sh: test -n "{{.NEW}}"
        msg: "NEW=<version-id> is required (task worker:versions to list)"
      - sh: test -n "{{.OLD}}"
        msg: "OLD=<version-id> is required — the id traffic falls back to"
    cmds:
      - pnpm exec wrangler versions deploy "{{.NEW}}@{{.PCT}}%" "{{.OLD}}@{{sub 100 (atoi .PCT)}}%" {{.ENV_FLAG}} --yes

  worker:promote:
    desc: "Route 100% of traffic to NEW=<version-id> ([ENV=staging])"
    dir: worker
    vars:
      ENV_FLAG: '{{if .ENV}}--env {{.ENV}}{{end}}'
    preconditions:
      - sh: test -n "{{.NEW}}"
        msg: "NEW=<version-id> is required (task worker:versions to list)"
    cmds:
      - pnpm exec wrangler versions deploy "{{.NEW}}@100%" {{.ENV_FLAG}} --yes

  docs:check:
    desc: Verify doc claims against code
    deps: [deps:install]
    cmds:
      # Every notme-xxxxxx cited in source or docs must resolve to a real
      # bead. A citation that resolves to nothing is worse than none — a
      # reader trusts the claim BECAUSE it looks sourced.
      - pnpm exec tsx scripts/bead-ref-check.ts
      - pnpm exec tsx scripts/doc-check.ts --skip-external

  pin:check:
    desc: Verify every external `uses:` in .github/workflows is SHA-pinned
    deps: [deps:install]
    cmds:
      - pnpm exec tsx scripts/check-sha-pins.ts
      # A pin can be correctly SHA-formatted and still serve stale code. For
      # our OWN action that is the only failure mode that matters, and it went
      # unnoticed for three PRs (notme-28959a).
      - pnpm exec tsx scripts/check-self-pins.ts

  action:bundle-check:
    desc: Rebuild action/dist from source and fail if it differs from what is committed
    # action/dist/index.js is a BUILD ARTIFACT COMMITTED TO GIT, because
    # `uses: agentic-research/notme/action@<sha>` executes the checked-in
    # bundle directly — GitHub does not build it. So the bundle is what runs,
    # and its sources are only a claim about what runs.
    #
    # That gap is not hypothetical here. A pnpm override pinning undici away
    # from three advisories sat inert for weeks while the committed bundle
    # still carried the vulnerable copy (notme-28959a): the config looked
    # correct, `pnpm audit` was clean, and the artifact two repos actually
    # executed was not. Nothing rebuilt the bundle, so nothing noticed.
    #
    # This gate closes that by making the committed artifact reproducible from
    # its sources on every PR. It is deliberately a DIFF and not a rebuild-and-
    # commit: a job that silently fixes the bundle would hide the fact that
    # someone pushed sources and artifact out of step, which is the signal
    # worth having.
    deps: [deps:install]
    cmds:
      - pnpm --filter ./action run build
      - |
        if ! git diff --quiet -- action/dist/index.js; then
          echo "::error file=action/dist/index.js::action/dist is stale — rebuild it and commit the result"
          echo
          echo "The committed bundle does not match its sources. This artifact is"
          echo "what 'uses: agentic-research/notme/action@<sha>' actually executes,"
          echo "so a stale bundle ships code nobody reviewed in this PR."
          echo
          echo "Fix:  cd action && npm run build && git add -f action/dist/index.js"
          echo
          git --no-pager diff --stat -- action/dist/index.js
          exit 1
        fi
        echo "action/dist matches its sources."

  ship:
    desc: "Safe path: preflight → install → check → docs → preview → verify instructions"
    cmds:
      - task: node:preflight
      - task: worker:install
      - task: worker:check
      - task: docs:check
      - task: worker:deploy-preview
      - echo ""
      - echo "Preview version uploaded. To go live (canary path):"
      - echo "  task worker:versions                   # find NEW/OLD version ids"
      - echo "  task worker:canary NEW=<id> OLD=<id>   # 10% canary (PCT=n to change)"
      - echo "  task worker:verify                     # smoke test during soak"
      - echo "  task worker:promote NEW=<id>           # 100% after soak"
      - echo "  task worker:promote NEW=<old-id>       # rollback = promote the old id"
      - echo ""
      - 'echo "Direct path (skips canary): task worker:deploy && task worker:verify"'

  ship-prod:
    desc: "Full send: preflight → install → check → docs → deploy → verify (rollback on failure)"
    cmds:
      - task: node:preflight
      - task: worker:install
      - task: worker:check
      - task: docs:check
      - task: worker:deploy
      - task: worker:verify

  worker:build-local:
    desc: Bundle worker for local workerd
    # worker.ts imports @agentic-research/dpop, a pnpm workspace sibling whose
    # entry point is ./dist/index.js — produced by tsc, and gitignored. On a
    # clean checkout that dist/ does not exist and esbuild fails with
    # "Could not resolve @agentic-research/dpop". Locally it always happened to
    # be there from an earlier build, which is why this only surfaced on the
    # first real release run (v0.1.0-rc1). `pnpm install --ignore-scripts`
    # cannot cover it either — that is exactly what skips the prepack build.
    deps: [dpop:build]
    dir: worker
    cmds:
      - pnpm exec esbuild worker.ts --bundle --format=esm --outfile=dist/worker.js --conditions=workerd --external:cloudflare:workers --external:@cloudflare/vitest-pool-workers

  worker:serve:
    desc: Run local identity authority via workerd
    dir: worker
    deps: [worker:build-local]
    cmds:
      - pnpm exec workerd serve config.capnp --experimental

  image:keygen:
    desc: Generate the melange signing key (one-time setup)
    dir: packages
    cmds:
      - melange keygen melange.rsa
    status:
      - test -f packages/melange.rsa
      - test -f packages/melange.rsa.pub

  image:apk:
    desc: Build the notme-app + workerd apks via melange (release-style, signed)
    deps: [worker:build-local, image:keygen]
    vars:
      # Defaults to the host arch — the local dev loop only ever wants the one
      # it can run. `image:publish` overrides with both, because apko-notme.yaml
      # declares an x86_64 + aarch64 index and apko needs an apk for each arch
      # it is asked to assemble.
      #
      # The `| default` template form is REQUIRED here. A task-level var
      # defined as `ARCHS: {sh: ...}` silently wins over a value passed from a
      # caller's `deps`/`cmds` vars, so the override was ignored and only the
      # native arch got built — apko then failed with "nothing provides
      # notme-app" for the other arch. Computing the native value into a
      # separate var and defaulting to it keeps the caller authoritative.
      NATIVE_ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
      ARCHS: "{{.ARCHS | default .NATIVE_ARCH}}"
      # Explicit runner so local and CI agree. melange defaults to bubblewrap
      # on Linux, and GitHub's ubuntu runners have no `bwrap` on PATH — the
      # v0.1.0-rc2 release died on exactly that. docker is already a hard
      # requirement for this pipeline (apko, `docker load`) and is the runner
      # every local build here was validated against, so it is the honest
      # common denominator rather than a second, untested path.
      RUNNER: '{{.RUNNER | default "docker"}}'
    cmds:
      - mkdir -p packages/out
      - |
        melange build packages/melange-notme-app.yaml \
          --arch {{.ARCHS}} \
          --runner {{.RUNNER}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out \
          --source-dir worker/
      - |
        melange build packages/melange-workerd.yaml \
          --arch {{.ARCHS}} \
          --runner {{.RUNNER}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out

  image:
    desc: Build the notme OCI image via apko (loads to docker via `docker load < packages/notme.tar`)
    deps: [image:apk]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
      ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - |
        cd packages && apko build apko-notme.yaml notme:{{.TAG}} notme.tar \
          --keyring-append melange.rsa.pub \
          --arch {{.ARCH}}
      - 'echo "Built packages/notme.tar — load with: docker load < packages/notme.tar"'

  # --- notme-proxy image (notme-83706a, cloister ADR-0041) ------------------
  #
  # The proxy ships as its own image because cloister declares it as a
  # separate hypervisor-tier bundle alongside notme-identity.
  #
  # Cross-compile happens HERE, natively, not inside melange. Neither existing
  # melange recipe compiles anything (workerd fetches a prebuilt binary,
  # notme-app installs a prebuilt worker.js) and this one doesn't either —
  # melange only ever runs `install`, so the aarch64 leg needs qemu for a file
  # copy rather than for a full cargo build.
  proxy:build:cross:
    desc: Cross-compile notme-proxy for x86_64 + aarch64 musl via cargo-zigbuild
    dir: proxy
    cmds:
      # musl: the proxy uses rustls with `ring`, never OpenSSL, so a static
      # binary drops the libc dependency from the image entirely.
      - cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
      - cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

  image:proxy:apk:
    desc: Build the notme-proxy apk via melange (signed)
    deps: [proxy:build:cross, image:keygen]
    vars:
      # See image:apk — `| default` is required so a caller-passed ARCHS wins
      # over the native fallback.
      NATIVE_ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
      ARCHS: "{{.ARCHS | default .NATIVE_ARCH}}"
      # See image:apk — bubblewrap is absent on GitHub's ubuntu runners.
      RUNNER: '{{.RUNNER | default "docker"}}'
    cmds:
      - mkdir -p packages/out
      # --source-dir is proxy/target so the recipe's install paths are
      # <triple>/release/notme-proxy, mirroring how melange-notme-app.yaml
      # reads worker/'s prebuilt dist/.
      - |
        melange build packages/melange-notme-proxy.yaml \
          --arch {{.ARCHS}} \
          --runner {{.RUNNER}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out \
          --source-dir proxy/target

  image:proxy:
    desc: Build the notme-proxy OCI image via apko (local tarball, dev loop)
    deps: [image:proxy:apk]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
      ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - |
        cd packages && apko build apko-notme-proxy.yaml notme-proxy:{{.TAG}} notme-proxy.tar \
          --keyring-append melange.rsa.pub \
          --arch {{.ARCH}}
      - 'echo "Built packages/notme-proxy.tar — load with: docker load < packages/notme-proxy.tar"'

  # --- release ---------------------------------------------------------------

  version:check:
    desc: "Assert server.json + melange recipes match the tag being pushed (VERSION=x.y.z)"
    deps: [deps:install]
    cmds:
      # VERSION is the tag apko will actually push, NOT the git tag. notme
      # strips the `v`, so those differ — see the script header and cloister
      # ADR-0041 §2 (corrected 2026-07-28).
      - pnpm exec tsx scripts/check-image-versions.ts {{.VERSION}}

  server:check:
    desc: "Validate server.json against its declared schema + its own version (PR gate)"
    deps: [deps:install]
    cmds:
      # The branch-time half of version:check. It cannot assert "matches the
      # pushed tag" — nothing on a PR knows the tag — so it asserts everything
      # else: schema conformance against the vendored 2025-12-11 schema, the
      # artifact-only shape, and the recipes agreeing with the file's own
      # declared version.
      #
      # This exists because running ONLY the release-time check is how two
      # defects shipped: the `packages[]`-without-`transport` schema violation
      # sat in main for two days and was found from another repo
      # (notme-6e5330), and a `description` 35 chars over the schema's limit
      # had never been checked by anything at all.
      - pnpm exec tsx scripts/check-image-versions.ts --self

  # Each image has its own publish task so CI can run them as INDEPENDENT
  # jobs. Cloister declares notme-identity and notme-proxy as two separate
  # hypervisor-tier bundles derived separately (ADR-0038), so coupling them
  # into one job would let a notme-proxy failure cancel a healthy notme
  # publish — the failure mode that cost rosary an image in v0.5.0.
  #
  # Both apk sets build for BOTH arches here: the apko configs declare an
  # x86_64 + aarch64 index and apko fails if an arch it was asked to assemble
  # has no apk. The local dev tasks keep their native-only default.

  image:publish:notme:
    desc: "Publish the notme image to ghcr (VERSION=x.y.z [REGISTRY=…] [SIGN=true])"
    deps:
      - task: image:apk
        vars: { ARCHS: "x86_64,aarch64" }
    vars:
      REGISTRY: '{{.REGISTRY | default "ghcr.io/agentic-research"}}'
    cmds:
      # The guard runs FIRST, against the same VERSION used to tag below.
      # Sharing the variable is what makes "publish a version server.json
      # doesn't declare" structurally impossible rather than merely
      # discouraged — a check against the git tag would pass while the
      # registry 404s.
      #
      # It validates the WHOLE manifest, not just this image's entry. The
      # manifest is repo-wide state and the check is free; a job that pushed
      # a correct notme while server.json misdeclared notme-proxy would be
      # publishing into a manifest it knows is broken.
      - task: version:check
        vars: { VERSION: "{{.VERSION}}" }
      - task: image:publish:one
        vars:
          CONFIG: apko-notme.yaml
          IMAGE: "{{.REGISTRY}}/notme"
          VERSION: "{{.VERSION}}"
          SIGN: "{{.SIGN}}"

  image:publish:proxy:
    desc: "Publish the notme-proxy image to ghcr (VERSION=x.y.z [REGISTRY=…] [SIGN=true])"
    deps:
      - task: image:proxy:apk
        vars: { ARCHS: "x86_64,aarch64" }
    vars:
      REGISTRY: '{{.REGISTRY | default "ghcr.io/agentic-research"}}'
    cmds:
      - task: version:check
        vars: { VERSION: "{{.VERSION}}" }
      - task: image:publish:one
        vars:
          CONFIG: apko-notme-proxy.yaml
          IMAGE: "{{.REGISTRY}}/notme-proxy"
          VERSION: "{{.VERSION}}"
          SIGN: "{{.SIGN}}"

  image:publish:
    desc: "Publish BOTH images (local convenience — CI publishes each independently)"
    cmds:
      - task: image:publish:notme
        vars:
          VERSION: "{{.VERSION}}"
          REGISTRY: "{{.REGISTRY}}"
          SIGN: "{{.SIGN}}"
      - task: image:publish:proxy
        vars:
          VERSION: "{{.VERSION}}"
          REGISTRY: "{{.REGISTRY}}"
          SIGN: "{{.SIGN}}"

  # Internal: publish one apko config. Not called directly — `image:publish`
  # drives it once per image so both share a single definition of "publish".
  image:publish:one:
    internal: true
    dir: packages
    cmds:
      # apko publish pushes a multi-arch index (archs come from the config).
      # cosign must sign the DIGEST, not the tag — a tag is mutable and a
      # re-push moves it, which would strand the signature on something else.
      #
      # The digest comes from `--image-refs`, apko's documented flag for
      # exactly this, rather than from scraping stdout. Scraping would couple
      # the release to apko's log formatting.
      - |
        set -euo pipefail
        REFS=$(mktemp)
        trap 'rm -f "${REFS}"' EXIT

        apko publish {{.CONFIG}} "{{.IMAGE}}:{{.VERSION}}" \
          --keyring-append melange.rsa.pub \
          --sbom-path . \
          --image-refs "${REFS}"

        # LAST line, not first. apko writes one ref per per-arch image
        # manifest and then the multi-arch INDEX last, and the index is what
        # the tag resolves to. Signing the first line signs a child manifest,
        # so `cosign verify <image>:<version>` — which resolves the tag to the
        # index — finds no signature and the signing is silently useless.
        # Verified against a local registry: line 1 was
        # application/vnd.oci.image.manifest.v1+json, the last line was
        # application/vnd.oci.image.index.v1+json, and the tag's
        # Docker-Content-Digest matched the last line.
        DIGEST=$(grep '@sha256:' "${REFS}" | tail -1)
        if [ -z "${DIGEST}" ]; then
          echo "apko wrote no digest reference to --image-refs; got:" >&2
          cat "${REFS}" >&2
          exit 1
        fi
        echo "published ${DIGEST}"

        if [ "{{.SIGN}}" = "true" ]; then
          cosign sign --yes "${DIGEST}"
          # The SBOM apko emitted for the multi-arch index, attached as an
          # in-toto attestation against the same digest.
          cosign attest --yes --type spdxjson \
            --predicate sbom-index.spdx.json "${DIGEST}"

          # VERIFY WHAT WE JUST SIGNED, against this exact workflow identity.
          #
          # Without this, "we sign our images" is a claim nothing executes —
          # and a signature that is never checked is indistinguishable from
          # one that silently did not happen. That is not hypothetical here:
          # `pnpm publish --provenance` was a no-op in this repo for three
          # releases (notme-77ead7) because `--provenance` is not a pnpm flag
          # and nothing checked the attestation landed.
          #
          # This is also what makes the REGISTRY CREDENTIAL non-load-bearing.
          # A stolen ghcr token can push an image; it cannot produce a keyless
          # signature, because that requires this workflow's OIDC identity
          # from Fulcio. So the push credential's blast radius is "can publish
          # something no verifier accepts" — but only if verification actually
          # happens somewhere.
          #
          # GITHUB_WORKFLOW_REF is exactly `owner/repo/.github/workflows/x.yml@ref`,
          # so the identity is EXACT rather than a regex. A regex here would be
          # a place for a too-permissive pattern to hide; an exact match cannot
          # accidentally admit a different workflow. It is also correct under
          # workflow_dispatch, where the ref is a branch rather than a tag.
          if [ -n "${GITHUB_WORKFLOW_REF:-}" ]; then
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${DIGEST}" > /dev/null
            cosign verify-attestation --type spdxjson \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${DIGEST}" > /dev/null
            echo "verified signature + SBOM attestation for ${DIGEST}"
          else
            echo "GITHUB_WORKFLOW_REF unset (not in GHA) — signed but NOT verified" >&2
          fi
        else
          echo "SIGN != true — skipping cosign (set SIGN=true to sign + attest)"
        fi

  # schema-bridge tasks
  #
  # capnp → zod TypeScript codegen via the Rust crate at
  # packages/schema-bridge/. Replaces the older `schema:ts` TS-based
  # codegen which silently emitted `z.unknown()` for unrecognised
  # constructs; schema-bridge fails fast on any unmapped capnp shape.
  #
  # NOT wired into `task verify` yet — schema-bridge doesn't yet map
  # the `$Go.package` / `$Go.import` annotations our identity.capnp
  # uses for Go codegen. Filing as a follow-on bead. Until that lands,
  # `task gen:zod` against identity.capnp will fail with a clear
  # `unmapped capnp construct annotation` diagnostic.
  schema-bridge:build:
    desc: Build the capnpc-schema-bridge plugin (release profile)
    dir: packages/schema-bridge
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/capnpc-schema-bridge
    cmds:
      - cargo build --locked --release

  gen:zod:
    desc: Regenerate gen/ts/*.zod.ts from schema/*.capnp via schema-bridge
    deps: [schema-bridge:build]
    cmds:
      # `capnp compile` exits 0 even when the plugin errors and writes
      # nothing — its stderr carries the real diagnostic. Generate into
      # a sibling tmpdir under gen/ts/ (same filesystem as destination)
      # so the final `mv` is a same-fs rename — atomic on POSIX. A
      # plain `mktemp -d` lands in $TMPDIR (often /tmp, a separate fs),
      # which silently degrades the rename to a cross-fs copy+unlink.
      - |
        set -eu
        mkdir -p gen/ts
        TMPDIR=$(mktemp -d -p gen/ts)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile \
          -o./packages/schema-bridge/target/release/capnpc-schema-bridge:"$TMPDIR" \
          -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" \
          --src-prefix=schema schema/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        mv "$TMPDIR/identity.zod.ts" gen/ts/identity.zod.ts

  gen:zod:check-drift:
    desc: Fail if committed gen/ts/*.zod.ts has drifted from a fresh regen
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        # Baseline must exist before we can diff against it. Until the
        # schema-bridge Go-annotation gap (rosary-8d2c78) is closed,
        # `task gen:zod` against identity.capnp errors out, so no
        # baseline is committed. Emit a clearer error than the raw
        # `diff: gen/ts/identity.zod.ts: No such file or directory`.
        if [ ! -f gen/ts/identity.zod.ts ]; then
          echo "FAIL — gen/ts/identity.zod.ts baseline missing; run \`task gen:zod\` and commit the output first (blocked on rosary-8d2c78)." >&2
          exit 1
        fi
        mkdir -p gen/ts
        TMPDIR=$(mktemp -d -p gen/ts)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile \
          -o./packages/schema-bridge/target/release/capnpc-schema-bridge:"$TMPDIR" \
          -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" \
          --src-prefix=schema schema/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        diff -u gen/ts/identity.zod.ts "$TMPDIR/identity.zod.ts"
