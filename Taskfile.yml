version: "3"

includes:
  dpop:
    taskfile: ./packages/dpop
    dir: ./packages/dpop

tasks:
  # Root pnpm install — used by any root-scope task that runs `pnpm exec`.
  # --ignore-scripts: never run install hooks (defense-in-depth, matches
  # worker:install + .npmrc posture). --frozen-lockfile: fail on lockfile
  # drift. `sources:` makes Task skip re-running when nothing changed.
  deps:install:
    desc: Install root deps (tsx, yaml, zod) via pnpm
    sources:
      - package.json
      - pnpm-lock.yaml
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts

  schema:ts:
    desc: Generate TypeScript types + Zod schemas from Cap'n Proto
    deps: [deps:install]
    cmds:
      - pnpm exec tsx schema/codegen/capnp-to-ts.ts schema/identity.capnp > gen/ts/identity.ts
      - echo "Generated gen/ts/identity.ts"

  schema:go:
    desc: Generate Go types from Cap'n Proto
    cmds:
      - capnp compile -o go:gen/go --src-prefix=schema -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" schema/identity.capnp
      - echo "Generated gen/go/identity.capnp.go"

  schema:all:
    desc: Generate all language bindings
    deps: [schema:ts, schema:go]

  schema:check:
    desc: Type-check generated code
    deps: [schema:ts]
    cmds:
      - pnpm exec tsc --noEmit --strict --moduleResolution bundler --module ES2022 --target ES2022 --skipLibCheck gen/ts/identity.ts

  worker:dev:
    desc: Start local dev server
    dir: worker
    cmds:
      - pnpm exec wrangler dev

  worker:install:
    desc: Clean install from lockfile (no scripts)
    dir: worker
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts

  worker:audit:
    desc: Check for known vulnerabilities
    dir: worker
    cmds:
      - pnpm audit --prod

  worker:check:
    desc: Type-check + test (audit is its own task — `worker:audit`)
    dir: worker
    deps: [dpop:build]
    cmds:
      - pnpm exec tsc --noEmit
      # Type-check the pool tests (*.do.test.ts), which the base tsconfig
      # excludes (**/*.test.ts) and vitest transpiles via esbuild without
      # checking. tsconfig.test.json loads the cloudflare:test types + the
      # ProvidedEnv augmentation so env bindings + DO instances are typed.
      - pnpm exec tsc -p tsconfig.test.json
      - pnpm exec vitest run
      # Real-Durable-Object tests (*.do.test.ts) via vitest-pool-workers.
      # Hermetic — its config declares DO bindings inline (no wrangler.toml,
      # no remote VPC binding), so it needs no CF creds and runs in CI.
      - pnpm exec vitest run --config vitest.workers.config.mts

  proxy:check:
    desc: Build + test the Rust mTLS proxy crate
    dir: proxy
    cmds:
      - cargo build --locked
      - cargo test --locked
      - cargo clippy --locked --tests -- -D warnings

  worker:deploy-preview:
    desc: Upload new version without routing traffic to it
    dir: worker
    cmds:
      - pnpm exec wrangler versions upload

  worker:deploy:
    desc: Deploy to production (use ship for the safe path)
    dir: worker
    cmds:
      - pnpm exec wrangler deploy

  worker:rollback:
    desc: Roll back to previous version
    dir: worker
    cmds:
      - pnpm exec wrangler rollback

  worker:verify:
    desc: Smoke test live endpoints with bounded deployment-convergence retries
    cmds:
      - |
        FAIL=0
        VERIFY_NONCE="$(date +%s)"
        MAX_ATTEMPTS=5
        RETRY_DELAY_SECONDS=2
        BODY_FILE="$(mktemp)"
        trap 'rm -f "$BODY_FILE"' EXIT

        check_request() {
          label="$1"
          method="$2"
          url="$3"
          expected_status="$4"
          expected_pattern="$5"
          data="${6:-}"
          accept="${7:-}"
          attempt=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if [ "$method" = "POST" ]; then
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
                -X POST "$url" -H "Content-Type: application/json" -d "$data")
            elif [ -n "$accept" ]; then
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
                -H "Accept: $accept" "$url")
            else
              status=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" "$url")
            fi

            if [ "$status" = "$expected_status" ] && grep -Fq "$expected_pattern" "$BODY_FILE"; then
              echo "✓ $label"
              return 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_DELAY_SECONDS"
            fi
            attempt=$((attempt + 1))
          done

          detail=$(head -c 160 "$BODY_FILE" | tr '\n' ' ')
          echo "✗ $label (got $status; body: $detail)"
          FAIL=1
        }

        echo "=== auth.notme.bot ==="
        check_request "landing" "GET" "https://auth.notme.bot/" "200" "identity authority"
        check_request "login" "GET" "https://auth.notme.bot/login" "200" "passkey"
        check_request "discovery" "GET" "https://auth.notme.bot/.well-known/signet-authority.json" "200" '"issuer"'
        # Cache API entries survive Worker deployments. A unique query checks
        # the newly deployed handler instead of the previous version's cache.
        check_request "ca-bundle" "GET" "https://auth.notme.bot/.well-known/ca-bundle.pem?verify=$VERIFY_NONCE" "200" "BEGIN CERTIFICATE"
        check_request "jwks" "GET" "https://auth.notme.bot/.well-known/jwks.json?verify=$VERIFY_NONCE" "200" '"crv":"Ed25519"'
        check_request "api-docs" "GET" "https://auth.notme.bot/api/docs" "200" "auth.notme.bot"
        check_request "passkey-status" "GET" "https://auth.notme.bot/auth/passkey/status" "401" '"error":"unauthorized"'
        check_request "authorize" "GET" "https://auth.notme.bot/authorize" "400" '"error":"redirect_uri required"'
        check_request "token" "POST" "https://auth.notme.bot/token" "400" '"error":"dpop_proof_required"' '{"audience":"https://test"}'

        echo "=== notme.bot ==="
        check_request "homepage" "GET" "https://notme.bot/" "200" "notme"
        check_request "apas" "GET" "https://notme.bot/apas?verify=$VERIFY_NONCE" "200" "0.2.1-draft"
        check_request "apas-schema" "GET" "https://notme.bot/provenance/dispatch/v1?verify=$VERIFY_NONCE" "200" '"workItemRef"' "" "application/schema+json"

        echo "---"
        [ $FAIL -eq 0 ] && echo "All checks passed." || { echo "SOME CHECKS FAILED"; exit 1; }

  docs:check:
    desc: Verify doc claims against code
    deps: [deps:install]
    cmds:
      - pnpm exec tsx scripts/doc-check.ts --skip-external

  pin:check:
    desc: Verify every external `uses:` in .github/workflows is SHA-pinned
    deps: [deps:install]
    cmds:
      - pnpm exec tsx scripts/check-sha-pins.ts

  ship:
    desc: "Safe path: install → check → docs → preview → verify instructions"
    cmds:
      - task: worker:install
      - task: worker:check
      - task: docs:check
      - task: worker:deploy-preview
      - echo ""
      - echo "Preview version uploaded. To go live:"
      - echo "  task worker:deploy      # route traffic to new version"
      - echo "  task worker:verify      # smoke test"
      - echo "  task worker:rollback    # if something breaks"

  ship-prod:
    desc: "Full send: install → check → docs → deploy → verify (rollback on failure)"
    cmds:
      - task: worker:install
      - task: worker:check
      - task: docs:check
      - task: worker:deploy
      - task: worker:verify

  worker:build-local:
    desc: Bundle worker for local workerd
    dir: worker
    cmds:
      - pnpm exec esbuild worker.ts --bundle --format=esm --outfile=dist/worker.js --conditions=workerd --external:cloudflare:workers --external:@cloudflare/vitest-pool-workers

  worker:serve:
    desc: Run local identity authority via workerd
    dir: worker
    deps: [worker:build-local]
    cmds:
      - pnpm exec workerd serve config.capnp --experimental

  image:keygen:
    desc: Generate the melange signing key (one-time setup)
    dir: packages
    cmds:
      - melange keygen melange.rsa
    status:
      - test -f packages/melange.rsa
      - test -f packages/melange.rsa.pub

  image:apk:
    desc: Build the notme-app + workerd apks via melange (release-style, signed)
    deps: [worker:build-local, image:keygen]
    vars:
      # Defaults to the host arch — the local dev loop only ever wants the one
      # it can run. `image:publish` overrides with both, because apko-notme.yaml
      # declares an x86_64 + aarch64 index and apko needs an apk for each arch
      # it is asked to assemble.
      ARCHS:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - mkdir -p packages/out
      - |
        melange build packages/melange-notme-app.yaml \
          --arch {{.ARCHS}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out \
          --source-dir worker/
      - |
        melange build packages/melange-workerd.yaml \
          --arch {{.ARCHS}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out

  image:
    desc: Build the notme OCI image via apko (loads to docker via `docker load < packages/notme.tar`)
    deps: [image:apk]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
      ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - |
        cd packages && apko build apko-notme.yaml notme:{{.TAG}} notme.tar \
          --keyring-append melange.rsa.pub \
          --arch {{.ARCH}}
      - 'echo "Built packages/notme.tar — load with: docker load < packages/notme.tar"'

  # --- notme-proxy image (notme-83706a, cloister ADR-0041) ------------------
  #
  # The proxy ships as its own image because cloister declares it as a
  # separate hypervisor-tier bundle alongside notme-identity.
  #
  # Cross-compile happens HERE, natively, not inside melange. Neither existing
  # melange recipe compiles anything (workerd fetches a prebuilt binary,
  # notme-app installs a prebuilt worker.js) and this one doesn't either —
  # melange only ever runs `install`, so the aarch64 leg needs qemu for a file
  # copy rather than for a full cargo build.
  proxy:build:cross:
    desc: Cross-compile notme-proxy for x86_64 + aarch64 musl via cargo-zigbuild
    dir: proxy
    cmds:
      # musl: the proxy uses rustls with `ring`, never OpenSSL, so a static
      # binary drops the libc dependency from the image entirely.
      - cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
      - cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

  image:proxy:apk:
    desc: Build the notme-proxy apk via melange (signed)
    deps: [proxy:build:cross, image:keygen]
    vars:
      ARCHS:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - mkdir -p packages/out
      # --source-dir is proxy/target so the recipe's install paths are
      # <triple>/release/notme-proxy, mirroring how melange-notme-app.yaml
      # reads worker/'s prebuilt dist/.
      - |
        melange build packages/melange-notme-proxy.yaml \
          --arch {{.ARCHS}} \
          --signing-key packages/melange.rsa \
          --out-dir packages/out \
          --source-dir proxy/target

  image:proxy:
    desc: Build the notme-proxy OCI image via apko (local tarball, dev loop)
    deps: [image:proxy:apk]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
      ARCH:
        sh: uname -m | sed 's/arm64/aarch64/'
    cmds:
      - |
        cd packages && apko build apko-notme-proxy.yaml notme-proxy:{{.TAG}} notme-proxy.tar \
          --keyring-append melange.rsa.pub \
          --arch {{.ARCH}}
      - 'echo "Built packages/notme-proxy.tar — load with: docker load < packages/notme-proxy.tar"'

  # --- release ---------------------------------------------------------------

  version:check:
    desc: "Assert server.json + melange recipes match the tag being pushed (VERSION=x.y.z)"
    deps: [deps:install]
    cmds:
      # VERSION is the tag apko will actually push, NOT the git tag. notme
      # strips the `v`, so those differ — see the script header and cloister
      # ADR-0041 §2 (corrected 2026-07-28).
      - pnpm exec tsx scripts/check-image-versions.ts {{.VERSION}}

  # Each image has its own publish task so CI can run them as INDEPENDENT
  # jobs. Cloister declares notme-identity and notme-proxy as two separate
  # hypervisor-tier bundles derived separately (ADR-0038), so coupling them
  # into one job would let a notme-proxy failure cancel a healthy notme
  # publish — the failure mode that cost rosary an image in v0.5.0.
  #
  # Both apk sets build for BOTH arches here: the apko configs declare an
  # x86_64 + aarch64 index and apko fails if an arch it was asked to assemble
  # has no apk. The local dev tasks keep their native-only default.

  image:publish:notme:
    desc: "Publish the notme image to ghcr (VERSION=x.y.z [REGISTRY=…] [SIGN=true])"
    deps:
      - task: image:apk
        vars: { ARCHS: "x86_64,aarch64" }
    vars:
      REGISTRY: '{{.REGISTRY | default "ghcr.io/agentic-research"}}'
    cmds:
      # The guard runs FIRST, against the same VERSION used to tag below.
      # Sharing the variable is what makes "publish a version server.json
      # doesn't declare" structurally impossible rather than merely
      # discouraged — a check against the git tag would pass while the
      # registry 404s.
      #
      # It validates the WHOLE manifest, not just this image's entry. The
      # manifest is repo-wide state and the check is free; a job that pushed
      # a correct notme while server.json misdeclared notme-proxy would be
      # publishing into a manifest it knows is broken.
      - task: version:check
        vars: { VERSION: "{{.VERSION}}" }
      - task: image:publish:one
        vars:
          CONFIG: apko-notme.yaml
          IMAGE: "{{.REGISTRY}}/notme"
          VERSION: "{{.VERSION}}"
          SIGN: "{{.SIGN}}"

  image:publish:proxy:
    desc: "Publish the notme-proxy image to ghcr (VERSION=x.y.z [REGISTRY=…] [SIGN=true])"
    deps:
      - task: image:proxy:apk
        vars: { ARCHS: "x86_64,aarch64" }
    vars:
      REGISTRY: '{{.REGISTRY | default "ghcr.io/agentic-research"}}'
    cmds:
      - task: version:check
        vars: { VERSION: "{{.VERSION}}" }
      - task: image:publish:one
        vars:
          CONFIG: apko-notme-proxy.yaml
          IMAGE: "{{.REGISTRY}}/notme-proxy"
          VERSION: "{{.VERSION}}"
          SIGN: "{{.SIGN}}"

  image:publish:
    desc: "Publish BOTH images (local convenience — CI publishes each independently)"
    cmds:
      - task: image:publish:notme
        vars:
          VERSION: "{{.VERSION}}"
          REGISTRY: "{{.REGISTRY}}"
          SIGN: "{{.SIGN}}"
      - task: image:publish:proxy
        vars:
          VERSION: "{{.VERSION}}"
          REGISTRY: "{{.REGISTRY}}"
          SIGN: "{{.SIGN}}"

  # Internal: publish one apko config. Not called directly — `image:publish`
  # drives it once per image so both share a single definition of "publish".
  image:publish:one:
    internal: true
    dir: packages
    cmds:
      # apko publish pushes a multi-arch index (archs come from the config).
      # cosign must sign the DIGEST, not the tag — a tag is mutable and a
      # re-push moves it, which would strand the signature on something else.
      #
      # The digest comes from `--image-refs`, apko's documented flag for
      # exactly this, rather than from scraping stdout. Scraping would couple
      # the release to apko's log formatting.
      - |
        set -euo pipefail
        REFS=$(mktemp)
        trap 'rm -f "${REFS}"' EXIT

        apko publish {{.CONFIG}} "{{.IMAGE}}:{{.VERSION}}" \
          --keyring-append melange.rsa.pub \
          --sbom-path . \
          --image-refs "${REFS}"

        DIGEST=$(grep -m1 '@sha256:' "${REFS}" || true)
        if [ -z "${DIGEST}" ]; then
          echo "apko wrote no digest reference to --image-refs; got:" >&2
          cat "${REFS}" >&2
          exit 1
        fi
        echo "published ${DIGEST}"

        if [ "{{.SIGN}}" = "true" ]; then
          cosign sign --yes "${DIGEST}"
          # The SBOM apko emitted for the multi-arch index, attached as an
          # in-toto attestation against the same digest.
          cosign attest --yes --type spdxjson \
            --predicate sbom-index.spdx.json "${DIGEST}"
        else
          echo "SIGN != true — skipping cosign (set SIGN=true to sign + attest)"
        fi

  # schema-bridge tasks
  #
  # capnp → zod TypeScript codegen via the Rust crate at
  # packages/schema-bridge/. Replaces the older `schema:ts` TS-based
  # codegen which silently emitted `z.unknown()` for unrecognised
  # constructs; schema-bridge fails fast on any unmapped capnp shape.
  #
  # NOT wired into `task verify` yet — schema-bridge doesn't yet map
  # the `$Go.package` / `$Go.import` annotations our identity.capnp
  # uses for Go codegen. Filing as a follow-on bead. Until that lands,
  # `task gen:zod` against identity.capnp will fail with a clear
  # `unmapped capnp construct annotation` diagnostic.
  schema-bridge:build:
    desc: Build the capnpc-schema-bridge plugin (release profile)
    dir: packages/schema-bridge
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/capnpc-schema-bridge
    cmds:
      - cargo build --locked --release

  gen:zod:
    desc: Regenerate gen/ts/*.zod.ts from schema/*.capnp via schema-bridge
    deps: [schema-bridge:build]
    cmds:
      # `capnp compile` exits 0 even when the plugin errors and writes
      # nothing — its stderr carries the real diagnostic. Generate into
      # a sibling tmpdir under gen/ts/ (same filesystem as destination)
      # so the final `mv` is a same-fs rename — atomic on POSIX. A
      # plain `mktemp -d` lands in $TMPDIR (often /tmp, a separate fs),
      # which silently degrades the rename to a cross-fs copy+unlink.
      - |
        set -eu
        mkdir -p gen/ts
        TMPDIR=$(mktemp -d -p gen/ts)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile \
          -o./packages/schema-bridge/target/release/capnpc-schema-bridge:"$TMPDIR" \
          -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" \
          --src-prefix=schema schema/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        mv "$TMPDIR/identity.zod.ts" gen/ts/identity.zod.ts

  gen:zod:check-drift:
    desc: Fail if committed gen/ts/*.zod.ts has drifted from a fresh regen
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        # Baseline must exist before we can diff against it. Until the
        # schema-bridge Go-annotation gap (rosary-8d2c78) is closed,
        # `task gen:zod` against identity.capnp errors out, so no
        # baseline is committed. Emit a clearer error than the raw
        # `diff: gen/ts/identity.zod.ts: No such file or directory`.
        if [ ! -f gen/ts/identity.zod.ts ]; then
          echo "FAIL — gen/ts/identity.zod.ts baseline missing; run \`task gen:zod\` and commit the output first (blocked on rosary-8d2c78)." >&2
          exit 1
        fi
        mkdir -p gen/ts
        TMPDIR=$(mktemp -d -p gen/ts)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile \
          -o./packages/schema-bridge/target/release/capnpc-schema-bridge:"$TMPDIR" \
          -I "$HOME/go/pkg/mod/capnproto.org/go/capnp/v3@v3.1.0-alpha.2/std" \
          --src-prefix=schema schema/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        diff -u gen/ts/identity.zod.ts "$TMPDIR/identity.zod.ts"
